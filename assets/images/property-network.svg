<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc"><title id="title">A property network with a relay station</title><desc id="desc">A square property with the internet hub in its upper-left corner. The orchard relay and gate station link directly to the hub. The pump station connects through the orchard relay. Four solar-powered stations are shown with illustrative reach circles.</desc><rect width="1000" height="1100" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><defs><clipPath id="map-clip"><rect x="60" y="140" width="880" height="880" rx="16"/></clipPath><pattern id="orchard" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="9" fill="#bdcdb6"/></pattern><pattern id="fields" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M0 0V30" stroke="#c7d2b4" stroke-width="8"/></pattern><marker id="link-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3c7b60"/></marker><g id="station"><path d="M0 0V55" stroke="#748478" stroke-width="5"/><path d="M-31 -24H16L32 -1H-15Z" fill="#446a77" stroke="#e7efea" stroke-width="2"/><path d="M-19 -24 -3 -1M-7 -24 9 -1M5 -24 21 -1M-24 -13H24" stroke="#afc6cc" stroke-width="1"/><rect x="-10" y="10" width="28" height="35" rx="3" fill="#fbfaf4" stroke="#5c7161" stroke-width="2"/><path d="M21 25H28V-15" stroke="#5c7161" stroke-width="3"/><circle cx="28" cy="-19" r="3" fill="#3c7b60"/></g></defs><text x="60" y="47" font-size="16" fill="#5c6b62" font-weight="600" text-anchor="start">PROPERTY NETWORKING</text><text x="60" y="92" font-size="32" fill="#234d3c" font-weight="700" text-anchor="start">One hub, three remote stations</text><g clip-path="url(#map-clip)"><rect x="60" y="140" width="880" height="880" fill="#f2f3e9"/><path d="M570 140H940V490H620Z" fill="url(#orchard)"/><path d="M360 530H650V1020H360Z" fill="url(#fields)"/><path d="M60 460H940M190 140V1020" fill="none" stroke="#e1d9c6" stroke-width="22"/><path d="M60 460H940M190 140V1020" fill="none" stroke="#f9f5eb" stroke-width="12"/><path d="M815 620Q904 580 947 660V804Q876 847 814 780T815 620Z" fill="#cfdee0"/><circle cx="255" cy="350" r="495" fill="none" stroke="#bccfbe" stroke-width="1.5" stroke-dasharray="6 9"/><circle cx="735" cy="350" r="495" fill="none" stroke="#bccfbe" stroke-width="1.5" stroke-dasharray="6 9"/><circle cx="255" cy="800" r="495" fill="none" stroke="#bccfbe" stroke-width="1.5" stroke-dasharray="6 9"/><circle cx="735" cy="800" r="495" fill="none" stroke="#bccfbe" stroke-width="1.5" stroke-dasharray="6 9"/><g transform="translate(105 330)"><rect y="0" width="65" height="52" fill="#e4ded0" stroke="#b9b39f"/><path d="M-8 0 32 -25 73 0Z" fill="#9d9f8c"/></g><path d="M168 922H212M177 908V938M202 908V938" stroke="#a1aa91" stroke-width="4"/><g fill="none" stroke="#fff" stroke-width="10"><path d="M302 350H688M255 397V753M735 397V753"/></g><g fill="none" stroke="#3c7b60" stroke-width="3.5" stroke-dasharray="10 7" marker-start="url(#link-arrow)" marker-end="url(#link-arrow)"><path d="M302 350H688"/><path d="M255 397V753"/><path d="M735 397V753"/></g><circle cx="255" cy="350" r="46" fill="#fff" stroke="#5b8a6d" stroke-width="2"/><use href="#station" transform="translate(254 340)"/><circle cx="220" cy="315" r="18" fill="#234d3c"/><text x="220" y="321" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="735" cy="350" r="46" fill="#fff" stroke="#5b8a6d" stroke-width="2"/><use href="#station" transform="translate(734 340)"/><circle cx="700" cy="315" r="18" fill="#234d3c"/><text x="700" y="321" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="255" cy="800" r="46" fill="#fff" stroke="#5b8a6d" stroke-width="2"/><use href="#station" transform="translate(254 790)"/><circle cx="220" cy="765" r="18" fill="#234d3c"/><text x="220" y="771" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="735" cy="800" r="46" fill="#fff" stroke="#5b8a6d" stroke-width="2"/><use href="#station" transform="translate(734 790)"/><circle cx="700" cy="765" r="18" fill="#234d3c"/><text x="700" y="771" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="100" y="220" width="310" height="79" rx="8" fill="#fff" fill-opacity=".97"/><text x="118" y="251" font-size="24" fill="#234d3c" font-weight="700" text-anchor="start">1 · Hub</text><text x="118" y="279" font-size="19" fill="#5c6b62" font-weight="400" text-anchor="start">Internet or satellite uplink</text><rect x="583" y="220" width="310" height="79" rx="8" fill="#fff" fill-opacity=".97"/><text x="601" y="251" font-size="24" fill="#234d3c" font-weight="700" text-anchor="start">2 · Orchard relay</text><text x="601" y="279" font-size="19" fill="#5c6b62" font-weight="400" text-anchor="start">Sensors + onward connection</text><rect x="100" y="870" width="310" height="79" rx="8" fill="#fff" fill-opacity=".97"/><text x="118" y="901" font-size="24" fill="#234d3c" font-weight="700" text-anchor="start">3 · Gate</text><text x="118" y="929" font-size="19" fill="#5c6b62" font-weight="400" text-anchor="start">Direct connection to hub</text><rect x="583" y="870" width="310" height="79" rx="8" fill="#fff" fill-opacity=".97"/><text x="601" y="901" font-size="24" fill="#234d3c" font-weight="700" text-anchor="start">4 · Pump</text><text x="601" y="929" font-size="19" fill="#5c6b62" font-weight="400" text-anchor="start">Reaches hub through station 2</text><rect x="785" y="568" width="136" height="58" rx="6" fill="#fff" fill-opacity=".95"/><text x="800" y="592" font-size="18" fill="#234d3c" font-weight="700" text-anchor="start">Relay link</text><text x="800" y="612" font-size="18" fill="#5c6b62" font-weight="400" text-anchor="start">2 ↔ 4</text></g><path d="M60 1061H108" stroke="#3c7b60" stroke-width="3" stroke-dasharray="10 7"/><text x="123" y="1068" font-size="18" fill="#5c6b62" font-weight="400" text-anchor="start">HaLow in mesh mode</text><circle cx="500" cy="1061" r="12" fill="none" stroke="#b2c7b6" stroke-width="2" stroke-dasharray="4 4"/><text x="523" y="1068" font-size="18" fill="#5c6b62" font-weight="400" text-anchor="start">Illustrative reach · example layout</text></g></svg>