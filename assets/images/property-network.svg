<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc"><title id="title">Four power stations, one property network</title><desc id="desc">Bird’s-eye farm layout with four solar-powered stations: central access point at the hub, and remote stations at the orchard, pump and gate. Dashed star links meet at the hub. Overlapping circles are illustrative radio reach, not measured coverage.</desc><rect width="1300" height="900" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><defs><clipPath id="map-clip"><rect x="35" y="145" width="1230" height="648" rx="18"/></clipPath><pattern id="crops" width="27" height="27" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><path d="M0 0V27" stroke="#aebf8e" stroke-width="10"/></pattern><pattern id="orchard" width="56" height="56" patternUnits="userSpaceOnUse"><circle cx="28" cy="28" r="13" fill="#8aa989"/><circle cx="23" cy="23" r="8" fill="#a3b79a"/></pattern><marker id="network-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#317d63"/></marker><g id="station"><path d="M0 2V59" stroke="#65756b" stroke-width="5"/><path d="M-27 -20H17L31 1H-13Z" fill="#426a76" stroke="#e1e8e5" stroke-width="2"/><path d="M-17 -20 -3 1M-5 -20 9 1M7 -20 21 1M-22 -10H24" stroke="#b3cbd0" stroke-width="1"/><rect x="-9" y="12" width="26" height="32" rx="3" fill="#f5f4ed" stroke="#52665a" stroke-width="2"/><path d="M20 27H27V-13" stroke="#495e50" stroke-width="3"/><circle cx="27" cy="-17" r="4" fill="#317d63"/></g></defs><text x="40" y="49" font-size="17" fill="#5c6b62" font-weight="600" text-anchor="start">FEATURED USE CASE / PROPERTY NETWORKING</text><text x="40" y="99" font-size="36" fill="#234d3c" font-weight="700" text-anchor="start">Four power stations, one property network</text><g clip-path="url(#map-clip)"><rect x="35" y="145" width="1230" height="648" fill="#ecefdf"/>