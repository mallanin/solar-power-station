{% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">{% endif %}
<style>
/* Shared visual defaults for documentation pages. */
.main-content th { text-align: left; }
.main-content th, .main-content td { vertical-align: top; }
.main-content figcaption { font-size: .8rem; line-height: 1.6; color: #526159; }
.main-content :is(h1, h2, h3, h4)[id] { scroll-margin-top: 1.25rem; }
</style>
{% if page.permalink == '/docs/build/' %}
<style>
.main-content .build-section-nav { margin: 1.5rem 0 2rem; padding: .9rem 1.1rem; border: 1px solid #d5e2da; border-radius: 7px; background: #f3f7f4; }
.main-content .build-section-nav ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .15rem 1.25rem; margin: .35rem 0 0; padding: 0; list-style: none; }
.main-content .build-section-nav li { margin: 0; padding: 0; }
.main-content .build-section-nav li::before { content: none; }
.build-section-nav a { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .5rem 0; }
.build-section-nav a:focus-visible { outline: 2px solid #234d3c; outline-offset: 3px; border-radius: 2px; }
@media (max-width: 600px) { .main-content .build-section-nav ul { grid-template-columns: 1fr; } }
.main-content .build-figure { margin: 1.4rem 0 1.8rem; }
.build-figure img { display: block; width: 100%; height: auto; border-radius: 7px; }
.main-content .build-portrait { width: 100%; max-width: var(--photo-max-width, 450px); margin-inline: auto; }
.main-content .build-figure figcaption { margin-top: .65rem; font-size: .8rem; line-height: 1.6; color: #526159; }
.build-annotated-photo { position: relative; }
.build-annotated-photo>svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.build-arrow { filter: drop-shadow(0 1px 3px #203a31); }
.build-joint-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.2rem; align-items: start; }
.main-content .build-joint-layout .build-figure { margin-top: .6rem; }
.build-photo-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; }
.main-content .build-photo-pair .build-figure { margin-top: .5rem; }
.enclosure-fit-note { margin: 1.4rem 0 1.8rem; padding: 1.1rem 1.3rem; border: 1px solid #e4ca7a; border-left: 4px solid #c69b29; border-radius: 7px; background: #fff7da; color: #51451f; }
.enclosure-fit-note>strong { display: block; font-size: 1rem; }
.main-content .enclosure-fit-note p { margin: .65rem 0 0; font-size: .88rem; line-height: 1.65; }
.mount-photo img { max-height: none; }
.mount-photo>svg a { pointer-events: auto; }
.mount-photo>svg a:hover rect, .mount-photo>svg a:focus rect { fill: #386c50; }
.mount-photo>svg a:focus-visible { outline: 5px solid #fff; outline-offset: 5px; }
@media (max-width: 600px) {
  .build-joint-layout { grid-template-columns: 1fr; gap: 0; }
  .build-photo-pair { grid-template-columns: 1fr; gap: 0; }

}
</style>
{% endif %}
{% if page.permalink == '/docs/system-design/' %}
<style>
/* Keep this page’s diagrams and comparison layout in sync with its content. */
.frame-comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; margin: 1.5rem 0 2rem; }
.frame-comparison .documentation-photo { margin: 0; }
.frame-comparison img { display: block; width: 100%; height: auto; border-radius: 7px; }
.main-content .frame-comparison figcaption { font-size: .8rem; line-height: 1.6; margin-top: .8rem; color: #526159; }
.frame-comparison figcaption>strong { display: block; margin-bottom: .25rem; color: #234d3c; }
@media (max-width: 600px) { .frame-comparison { grid-template-columns: 1fr; gap: 1.5rem; } }
/* Original app screenshot with explanations aligned to its three readout groups. */
.victron-monitor { margin: 1.5rem 0 2rem; padding: 1.1rem; border: 1px solid #dce4da; border-radius: 9px; background: #f5f7f2; }
.victron-monitor-layout { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1fr); column-gap: 3rem; }
.victron-monitor img { display: block; width: 100%; height: auto; border-radius: 7px; }
.main-content .victron-monitor figcaption { display: grid; grid-template-rows: 17fr 37fr 22fr 24fr; margin: 0; padding: 0; min-width: 0; font-size: .83rem; line-height: 1.55; color: #526159; }
.monitor-callout { position: relative; align-self: center; }
.monitor-solar { grid-row: 2; }
.monitor-battery { grid-row: 3; }
.monitor-load { grid-row: 4; }
.monitor-callout::before { content: ''; position: absolute; top: 50%; right: calc(100% + .65rem); width: 2.35rem; border-top: 1px dashed #718b70; }
.monitor-callout>strong { display: block; color: #234d3c; font-size: .95rem; font-weight: 650; }
.main-content .monitor-callout p { margin: .35rem 0 0; }
@media (max-width: 900px) {
  .victron-monitor-layout { grid-template-columns: 1fr; gap: 1.4rem; }
  .victron-monitor img { max-width: 280px; margin: 0 auto; }
  .main-content .victron-monitor figcaption { display: grid; grid-template-rows: none; gap: 1.2rem; }
  .monitor-callout { grid-row: auto; padding-left: .9rem; border-left: 1px dashed #718b70; }
  .monitor-callout::before { display: none; }
}
/* System-design diagrams, ideal-energy references and optional applications. */
.design-diagram { margin: 1.5rem 0 2rem; padding: .8rem; border: 1px solid #dce4da; border-radius: 9px; background: #fff; }
.design-diagram>a, .design-diagram img, .network-figure>svg { display: block; width: 100%; height: auto; }
.main-content .design-diagram figcaption { margin: .7rem .2rem .1rem; font-size: .75rem; line-height: 1.6; }
.equation-label { display: block; margin-bottom: .4rem; color: #526159; font-size: .8rem; font-weight: 600; }
.solar-reference { padding: .12rem .35rem; border-radius: 4px; background: #e1eed7; color: #234d3c; }
.resilience-note { background: #edf3e5; border-color: #c8d9bd; color: #294d37; }
.diagram-legend { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; padding: .2rem .3rem .8rem; color: #526159; font-size: .72rem; }
.diagram-legend span::before { content: ''; display: inline-block; width: 1.5rem; margin-right: .4rem; vertical-align: middle; border-top: 2px dashed #b9974e; }
.diagram-legend .signal-legend::before { border-color: #3a7a64; }
.application-details { margin: 1rem 0; padding: 0 1.1rem; border: 1px solid #d4dfcd; border-radius: 7px; background: #fafbf7; }
.application-details summary { padding: 1rem 0; cursor: pointer; font-weight: 600; color: #234d3c; line-height: 1.5; }
.application-details summary:focus-visible { outline: 3px solid #b57c20; outline-offset: 3px; }
.application-details[open] summary { border-bottom: 1px solid #dce4da; }
.application-details>p, .application-details>ul { font-size: .9rem; }
@media (max-width: 600px) {
  .design-diagram { padding: .4rem; }
  .application-details { padding: 0 .85rem; }
}
</style>
{% endif %}
{% if page.permalink == '/docs/cost/' %}
<style>
.main-content .parts-table { min-width: 600px; table-layout: fixed; font-size: .8rem; line-height: 1.5; }
.parts-table .part-item { width: 17%; }
.parts-table .part-quantity { width: 11%; }
.parts-table .part-source { width: 23%; }
.parts-table .part-price { width: 13%; }
.parts-table .part-notes { width: 36%; }
.main-content .parts-table th, .main-content .parts-table td { padding: .75rem .55rem; vertical-align: top; overflow-wrap: break-word; }
.parts-table th[scope="row"] { font-weight: 600; text-align: left; }
.parts-table tr[id], .cad-download { scroll-margin-top: 1.5rem; }
.cad-download { padding: .6rem .8rem; border-left: 3px solid #c8d9bd; }
.cad-download:target { background: #e1eed7; }
.main-content .parts-table tr:target>* { background: #e1eed7; }
.parts-table tfoot td:first-of-type { white-space: nowrap; font-variant-numeric: tabular-nums; }
.parts-table td:nth-child(4) { white-space: nowrap; font-variant-numeric: tabular-nums; }
.parts-table .price-detail { display: block; margin-top: .25rem; color: #526159; font-size: .68rem; white-space: normal; }
.main-content .parts-table tfoot>* >* { background: #edf3e5; color: #244c35; font-weight: 600; }
.parts-total { margin: 1.5rem 0; padding: 1.25rem 1.5rem; border: 1px solid #c8d9bd; border-radius: 8px; background: #edf3e5; color: #244c35; }
.parts-total>span { display: block; font-size: .85rem; }
.parts-total>strong { display: block; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.parts-total>p { margin: .35rem 0 0; font-size: .85rem; }
</style>
{% endif %}
