{% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">{% endif %}
{% if page.permalink == '/docs/system-design/' %}
<style>
/* Keep this page’s diagrams and comparison layout in sync with its content. */
.frame-comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; margin: 1.5rem 0 2rem; }
.frame-comparison .documentation-photo { margin: 0; }
.frame-comparison .documentation-photo>div { min-height: 220px; }
.main-content .frame-comparison figcaption { font-size: .86rem; line-height: 1.65; margin-top: .8rem; color: #526159; }
@media (max-width: 600px) { .frame-comparison { grid-template-columns: 1fr; gap: 1.5rem; } }
/* System-design diagrams, ideal-energy references and optional applications. */
.design-diagram { margin: 1.5rem 0 2rem; padding: .8rem; border: 1px solid #dce4da; border-radius: 9px; background: #fff; }
.design-diagram>a, .design-diagram img, .network-figure>svg { display: block; width: 100%; height: auto; }
.main-content .design-diagram figcaption { margin: .7rem .2rem .1rem; font-size: .75rem; line-height: 1.6; }
.equation-label { display: block; margin-bottom: .4rem; color: #526159; font-size: .8rem; font-weight: 600; }
.solar-reference { padding: .12rem .35rem; border-radius: 4px; background: #e1eed7; color: #234d3c; }
.resilience-note { background: #edf3e5; border-color: #c8d9bd; color: #294d37; }
.diagram-legend { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; padding: .2rem .3rem .8rem; color: #526159; font-size: .72rem; }
.diagram-legend span::before { content: ''; display: inline-block; width: 1.5rem; margin-right: .4rem; vertical-align: middle; border-top: 2px dashed #b9974e; }
.diagram-legend .signal-legend::before { border-color: #3a7a64; }
.application-details { margin: 1rem 0; padding: 0 1.1rem; border: 1px solid #d4dfcd; border-radius: 7px; background: #fafbf7; }
.application-details summary { padding: 1rem 0; cursor: pointer; font-weight: 600; color: #234d3c; line-height: 1.5; }
.application-details summary:focus-visible { outline: 3px solid #b57c20; outline-offset: 3px; }
.application-details[open] summary { border-bottom: 1px solid #dce4da; }
.application-details>p, .application-details>ul { font-size: .9rem; }
@media (max-width: 600px) {
  .design-diagram { padding: .4rem; }
  .application-details { padding: 0 .85rem; }
}
</style>
{% endif %}
{% if page.permalink == '/docs/cost/' %}
<style>
.main-content .parts-table { min-width: 640px; table-layout: fixed; font-size: .8rem; line-height: 1.5; }
.parts-table .part-item { width: 17%; }
.parts-table .part-quantity { width: 10%; }
.parts-table .part-source { width: 24%; }
.parts-table .part-price { width: 12%; }
.parts-table .part-notes { width: 37%; }
.main-content .parts-table th, .main-content .parts-table td { padding: .75rem .55rem; vertical-align: top; overflow-wrap: break-word; }
.parts-table th[scope="row"] { font-weight: 600; }
.parts-table td:nth-child(4) { white-space: nowrap; font-variant-numeric: tabular-nums; }
.parts-table .price-detail { display: block; margin-top: .25rem; color: #526159; font-size: .68rem; white-space: normal; }
.main-content .parts-table tfoot>* >* { background: #edf3e5; color: #244c35; font-weight: 600; }
.parts-total { margin: 1.5rem 0; padding: 1.25rem 1.5rem; border: 1px solid #c8d9bd; border-radius: 8px; background: #edf3e5; color: #244c35; }
.parts-total>span { display: block; font-size: .85rem; }
.parts-total>strong { display: block; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.parts-total>p { margin: .35rem 0 0; font-size: .85rem; }
</style>
{% endif %}
