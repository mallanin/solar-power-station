title: OpenPowerBox
description: Practical, open documentation for affordable off-grid solar power.
theme: just-the-docs
url: https://openpowerbox.com
baseurl: ""
repository: mallanin/solar-power-station
permalink: pretty
color_scheme: solar
search_enabled: false
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  View on GitHub:
    - https://github.com/mallanin/solar-power-station
aux_links_new_tab: false
gh_edit_link: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE-NOTE.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
  - .github/
